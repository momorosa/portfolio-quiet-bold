<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1425 664" fill="none" role="img" aria-label="TomoCare Phase 0: Working Brain — end-to-end architecture diagram">
  <title>TomoCare Phase 0: Working Brain</title>
  <desc>Three-band architecture diagram showing the end-to-end Phase 0 pipeline. Top band (Ingestion and Source Truth): PDFs flow through Document Upload to Immutable PDF storage and a Documents table. Middle band (Phase 0 Fact Extraction Pipeline): Ingestion and Parsing to Raw Text to Extraction Agent to Candidate Truth, with a Correction Feedback loop. Bottom band (Phase 0 Trusted Truth and Action): Materialization writes to Trusted Events, which drives idempotent Calendar Sync producing a Google Calendar reminder. A dotted provenance arc connects Trusted Events back to Documents.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="context-stroke" stroke="context-stroke" stroke-width="1" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="8" y="38" fill="#FFFFFF" font-family="Montserrat, sans-serif" font-size="40" font-weight="700">TomoCare - Phase 0: Working Brain</text>

  <g id="band-source">
    <rect x="0" y="100" width="6" height="54" fill="#E8B059"/>
    <text x="19" y="131" fill="#E8B059" font-family="Montserrat, sans-serif" font-size="14">Ingestion &amp; Source Truth</text>

    <rect x="0" y="190" width="208" height="71" rx="8" fill="#262626"/>
    <text x="104" y="220" fill="#E8B059" font-family="Inter, sans-serif" font-size="14" text-anchor="middle">PDFs</text>
    <text x="104" y="241" fill="#E8B059" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">Receipts, labs</text>

    <line x1="213" y1="226" x2="325" y2="226" stroke="#F0F0F0" stroke-width="1" stroke-dasharray="2 2" marker-end="url(#arrow)"/>

    <rect x="330" y="190" width="208" height="71" rx="8" fill="#262626"/>
    <text x="434" y="220" fill="#F5F5F5" font-family="Inter, sans-serif" font-size="14" text-anchor="middle">Document Upload</text>
    <text x="434" y="241" fill="#F5F5F5" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">Stable storage keys</text>

    <line x1="540" y1="226" x2="656" y2="226" stroke="#F0F0F0" stroke-width="1" stroke-dasharray="2 2" marker-end="url(#arrow)"/>

    <rect x="661" y="190" width="208" height="71" rx="8" fill="#262626"/>
    <text x="765" y="220" fill="#F5F5F5" font-family="Inter, sans-serif" font-size="14" text-anchor="middle">Immutable PDF</text>
    <text x="765" y="241" fill="#F5F5F5" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">Private bucket</text>

    <line x1="871" y1="226" x2="986" y2="226" stroke="#F0F0F0" stroke-width="1" stroke-dasharray="2 2" marker-end="url(#arrow)"/>

    <rect x="991" y="190" width="208" height="71" rx="8" fill="#262626"/>
    <text x="1095" y="220" fill="#F5F5F5" font-family="Inter, sans-serif" font-size="14" text-anchor="middle">Documents</text>
    <text x="1095" y="241" fill="#F5F5F5" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">Provenance</text>
  </g>

  <g id="band-extraction">
    <rect x="0" y="318" width="6" height="54" fill="#E8B059"/>
    <text x="22" y="342" fill="#E8B059" font-family="Montserrat, sans-serif" font-size="14">Phase 0:</text>
    <text x="22" y="359" fill="#E8B059" font-family="Montserrat, sans-serif" font-size="14">Fact Extraction Pipeline</text>

    <rect x="293" y="318" width="1101" height="143" rx="16" fill="#262626" fill-opacity="0.5"/>

    <rect x="322" y="355" width="226" height="69" rx="8" fill="#262626"/>
    <text x="435" y="394" fill="#F5F5F5" font-family="Inter, sans-serif" font-size="14" text-anchor="middle">Ingestion &amp; Parsing</text>

    <line x1="548" y1="389" x2="583" y2="389" stroke="#F0F0F0" stroke-width="1" stroke-dasharray="2 2" marker-end="url(#arrow)"/>

    <rect x="589" y="356" width="219" height="65" rx="7" fill="none" stroke="#5A5A5A" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="698" y="383" fill="#F5F5F5" font-family="Inter, sans-serif" font-size="14" text-anchor="middle">Raw Text</text>
    <text x="698" y="404" fill="#F5F5F5" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">Auditable intermediate</text>

    <line x1="810" y1="389" x2="845" y2="389" stroke="#F0F0F0" stroke-width="1" stroke-dasharray="2 2" marker-end="url(#arrow)"/>

    <rect x="850" y="355" width="224" height="67" rx="8" fill="#262626"/>
    <text x="962" y="383" fill="#F5F5F5" font-family="Inter, sans-serif" font-size="14" text-anchor="middle">Extraction Agent</text>
    <text x="962" y="404" fill="#F5F5F5" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">ADK + Gemini</text>

    <line x1="1075" y1="389" x2="1110" y2="389" stroke="#F0F0F0" stroke-width="1" stroke-dasharray="2 2" marker-end="url(#arrow)"/>

    <rect x="1115" y="355" width="251" height="67" rx="8" fill="#262626"/>
    <text x="1240" y="383" fill="#F5F5F5" font-family="Inter, sans-serif" font-size="14" text-anchor="middle">Candidate Truth</text>
    <text x="1240" y="404" fill="#F5F5F5" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">(JSONB)</text>

    <path d="M 1240 422 V 446 H 435 V 424" fill="none" stroke="#F0F0F0" stroke-width="1" stroke-dasharray="2 2" marker-end="url(#arrow)"/>
    <text x="838" y="441" fill="#F5F5F5" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">Correction Feedback</text>
  </g>

  <g id="band-action">
    <rect x="6" y="521" width="6" height="54" fill="#E8B059"/>
    <text x="27" y="545" fill="#E8B059" font-family="Montserrat, sans-serif" font-size="14">Phase 0:</text>
    <text x="27" y="562" fill="#E8B059" font-family="Montserrat, sans-serif" font-size="14">Trusted Truth &amp; Action</text>

    <rect x="293" y="521" width="1101" height="143" rx="16" fill="#262626" fill-opacity="0.5"/>

    <line x1="435" y1="461" x2="435" y2="552" stroke="#F0F0F0" stroke-width="1" stroke-dasharray="2 2" marker-end="url(#arrow)"/>
    <text x="465" y="510" fill="#F5F5F5" font-family="Inter, sans-serif" font-size="12">Promote</text>

    <rect x="324" y="554" width="224" height="67" rx="8" fill="#444441"/>
    <text x="436" y="582" fill="#F5F5F5" font-family="Inter, sans-serif" font-size="14" text-anchor="middle">Materialization</text>
    <text x="436" y="603" fill="#F5F5F5" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">Rule-driven</text>

    <line x1="549" y1="588" x2="579" y2="588" stroke="#F0F0F0" stroke-width="1" stroke-dasharray="2 2" marker-end="url(#arrow)"/>

    <rect x="585" y="556" width="224" height="67" rx="8" fill="#444441"/>
    <text x="697" y="584" fill="#F5F5F5" font-family="Inter, sans-serif" font-size="14" text-anchor="middle">Trusted Events</text>
    <text x="697" y="605" fill="#F5F5F5" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">Normalized table</text>

    <line x1="810" y1="588" x2="845" y2="588" stroke="#F0F0F0" stroke-width="1" stroke-dasharray="2 2" marker-end="url(#arrow)"/>

    <rect x="850" y="558" width="224" height="67" rx="8" fill="#444441"/>
    <text x="962" y="586" fill="#F5F5F5" font-family="Inter, sans-serif" font-size="14" text-anchor="middle">Calendar Sync</text>
    <text x="962" y="607" fill="#F5F5F5" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">Idempotent upsert</text>

    <line x1="1075" y1="588" x2="1110" y2="588" stroke="#F0F0F0" stroke-width="1" stroke-dasharray="2 2" marker-end="url(#arrow)"/>

    <rect x="1115" y="558" width="251" height="67" rx="8" fill="#444441"/>
    <text x="1240" y="586" fill="#F5F5F5" font-family="Inter, sans-serif" font-size="14" text-anchor="middle">Google Calendar</text>
    <text x="1240" y="607" fill="#F5F5F5" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">Reminder</text>
  </g>

  <g id="provenance-arc">
    <path d="M 697 556 V 540 H 1400 V 226 H 1204" fill="none" stroke="#CF9033" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
    <text x="1050" y="535" fill="#CF9033" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">Provenance: every trusted row traces back to its source document</text>
  </g>
</svg>
